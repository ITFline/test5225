<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk Specialists</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Kanit, sans-serif;
      background-color: #000033;
    }
    label {
      color: white;
    }
    .container {
      max-width: 600px;
    }
  </style>
</head>

<body>
  <div align="center">
    <img src="https://img2.pic.in.th/pic/af17ea5feab02084a5a9861e30005ec6.png" width="416" height="120">
  </div>

  <div class="container">
    <form id="myForm" class="needs-validation my-4" novalidate>
      <div class="text-center">
        <p class="h2 text-light">แจ้งปัญหา IT Helpdesk Specialists</p>
      </div>
      <div class="mb-3">
        <label for="name">ชื่อ (ผู้ติดต่อ)</label>
        <input type="text" id="name" name="name" class="form-control" required>
        <div class="invalid-feedback">กรุณากรอกชื่อ-สกุล</div>
      </div>
      <div class="mb-3">
        <label for="phone">เบอร์ติดต่อ</label>
        <input type="text" id="phone" name="phone" class="form-control" required>
        <div class="invalid-feedback">กรุณากรอกเบอร์โทร</div>
      </div>
      <div class="mb-3">
        <label for="device">อุปกรณ์ที่มีปัญหา</label>
        <select id="device" name="device" class="form-select" required>
          <option value="">-- กรุณาเลือก --</option>
          <option>Computer PC</option>
          <option>Notebook</option>
          <option>Macintosh</option>
          <option>MacBook</option>
        </select>
        <div class="invalid-feedback">กรุณาเลือกอุปกรณ์</div>
      </div>
      <div class="mb-3">
        <label for="problem">แจ้งปัญหา</label>
        <select id="problem" name="problem" class="form-select" required>
          <option value="">-- กรุณาเลือก --</option>
          <option>โปรแกรม Error</option>
          <option>เข้าใช้งานไดร์กลางของแผนกไม่ได้</option>
          <option>Remote Desktop เข้าใช้งานไม่ได้</option>
          <option>VPN ไม่สามารถใช้งานได้</option>
          <option>Internet / WiFi ไม่สามารถใช้งานได้</option>
          <!-- เพิ่มหัวข้ออื่นๆ ได้ที่นี่ -->
        </select>
        <div class="invalid-feedback">กรุณาเลือกปัญหา</div>
      </div>
      <div class="mb-4">
        <label for="place">แผนก</label>
        <select id="place" name="place" class="form-select" required>
          <option value="">-- กรุณาเลือก --</option>
          <option>General Affairs</option>
          <option>Call Center</option>
          <option>IT Facilities</option>
          <option>Marketing</option>
          <option>Operation BKK</option>
          <!-- เพิ่มแผนกอื่นๆ ได้ที่นี่ -->
        </select>
        <div class="invalid-feedback">กรุณาเลือกแผนก</div>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-warning w-100">
          <i class="bi bi-send-fill"></i> แจ้งซ่อม
        </button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/gasparesganga-jquery-loading-overlay@2.1.7/dist/loadingoverlay.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const scriptUrl = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

    $(document).ready(() => {
      liff.init({ liffId: 'YOUR_LIFF_ID', withLoginOnExternalBrowser: true })
        .then(() => console.log('LIFF Initialized'));
    });

    function submitForm() {
      $.LoadingOverlay('show');
      const data = {
        opt: 'savedata',
        uid: liff.getDecodedIDToken().sub,
        name: $('#name').val(),
        phone: $('#phone').val(),
        device: $('#device').val(),
        problem: $('#problem').val(),
        place: $('#place').val()
      };

      $.post(scriptUrl, data, res => {
        $.LoadingOverlay('hide');
        if (res.status === 'success') {
          Swal.fire({ icon: 'success', title: 'แจ้งซ่อมเรียบร้อย' }).then(() => {
            liff.sendMessages([{
              type: 'text',
              text: `✅ แจ้งซ่อมเรียบร้อย\nรหัสงาน: ${res.id}\nอุปกรณ์: ${data.device}\nปัญหา: ${data.problem}`
            }]).then(() => liff.closeWindow());
          });
        } else {
          Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด' });
        }
      }).fail(() => {
        $.LoadingOverlay('hide');
        Swal.fire({ icon: 'error', title: 'ส่งข้อมูลไม่สำเร็จ' });
      });
    }

    (() => {
      'use strict';
      const form = document.querySelector('#myForm');
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (!form.checkValidity()) {
          event.stopPropagation();
          form.classList.add('was-validated');
        } else {
          submitForm();
        }
      }, false);
    })();
  </script>
</body>

</html>
