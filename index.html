<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk Specialists</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

  <style>
    body {
      font-family: Kanit, sans-serif;
      background-color: #000033;
    }
    label {
      color: white;
    }
    .container {
      max-width: 600px;
    }
  </style>
</head>

<body>
  <div align="center">
    <img src="https://img2.pic.in.th/pic/af17ea5feab02084a5a9861e30005ec6.png" alt="coala" width="416" height="120">
  </div>

  <div class="container">
    <form id="myForm" class="needs-validation my-4" novalidate>
      <div class="row">
        <div class="col-14 text-center">
          <p class="h2 text-light">แจ้งปัญหา IT Helpdesk Specialists</p>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-12">
          <label for="name">ชื่อ (ผู้ติดต่อ)</label>
          <input type="text" id="name" name="name" class="form-control" required>
          <div class="invalid-feedback">กรุณากรอกชื่อ-สกุล</div>
        </div>
        <div class="col-12">
          <label for="phone">เบอร์ติดต่อ (ที่สามารถติดต่อได้)</label>
          <input type="text" id="phone" name="phone" class="form-control" required>
          <div class="invalid-feedback">กรุณากรอกเบอร์โทร</div>
        </div>
        <div class="col-12">
          <label for="device">*อุปกรณ์ที่มีปัญหา*</label>
          <select id="device" class="form-select" required>
            <option value="">----------------กรุณาเลือก-----------------</option>
            <option value="Computer PC">▫️ Computer PC</option>
            <option value="Notebook">▫️ Notebook</option>
            <option value="Macintosh">▫️ Macintosh</option>
            <option value="MacBook">▫️ MacBook</option>
          </select>
        </div>
        <div class="col-12">
          <label for="problem">*แจ้งปัญหาการใช้งาน*</label>
          <select id="problem" class="form-select" required>
            <option value="">-----------เลือกหัวข้อที่คุณต้องการ-----------</option>
            <option value="โปรแกรม Error">▫️ โปรแกรม Error</option>
            <option value="เข้าใช้งานไดร์กลางของแผนกไม่ได้">▫️ เข้าใช้งานไดร์กลางของแผนกไม่ได้</option>
            <!-- เพิ่ม option อื่น ๆ ตามที่มี -->
          </select>
        </div>
        <div class="col-12">
          <label for="place">*แผนก*🔎</label>
          <select id="place" class="form-select" required>
            <option value="">----------------กรุณาเลือก----------------</option>
            <option value="General Affairs">▫️ General Affairs</option>
            <option value="call center">▫️ call center</option>
            <!-- เพิ่ม option อื่น ๆ ตามที่มี -->
          </select>
        </div>
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-warning w-100">
            <i class="bi bi-send-fill"></i>&nbsp;แจ้งซ่อม
          </button>
        </div>
      </div>
    </form>
  </div>

  <script>
    const scriptUrl = 'https://script.google.com/macros/s/YOUR_DEPLOYED_URL/exec';

    $(document).ready(() => {
      liff.init({
        liffId: '1657934014-yMv0gDop',
        withLoginOnExternalBrowser: true
      })
      liff.ready.then(() => {
        console.log('LIFF ready');
      });
    });

    function submit() {
      $.LoadingOverlay('show');

      liff.getProfile().then(profile => {
        let data = {
          opt: 'savedata',
          uid: profile.userId,
          name: $('#name').val(),
          phone: $('#phone').val(),
          device: $('#device').val(),
          problem: $('#problem').val(),
          place: $('#place').val(),
        }

        $.ajax({
          method: "POST",
          url: scriptUrl,
          data: data,
          dataType: 'json',
          success: function (res) {
            $.LoadingOverlay('hide');
            if (res.status == 'success') {
              Swal.fire({
                icon: 'success',
                title: 'แจ้งซ่อมเรียบร้อย',
                allowOutsideClick: false,
                confirmButtonText: 'ตกลง'
              }).then(() => {
                liff.sendMessages([{
                  type: 'text',
                  text: `✅ แจ้งซ่อมเรียบร้อย\nรหัสงานซ่อม: ${res.id}\nอุปกรณ์: ${data.device}\nปัญหา: ${data.problem}`
                }]).then(() => {
                  liff.closeWindow();
                });
              });
            } else {
              Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด' });
            }
          },
          error: function (err) {
            console.log(err);
            $.LoadingOverlay('hide');
            alert('บันทึกข้อมูลไม่สำเร็จ');
          }
        });
      });
    }
  </script>

  <script>
    (() => {
      'use strict';
      const forms = document.querySelectorAll('.needs-validation');
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          event.preventDefault();
          if (!form.checkValidity()) {
            form.classList.add('was-validated');
            $('#myForm').find(":invalid").first().focus();
          } else {
            submit();
          }
        }, false);
      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/gasparesganga-jquery-loading-overlay@2.1.7/dist/loadingoverlay.min.js"></script>
</body>

</html>
