<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Helpdesk Specialists</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />
  <style>
    body { background-color: #000033; font-family: 'Kanit', sans-serif; }
    label { color: white; }
    .container { max-width: 600px; }
  </style>
</head>
<body>
  <div class="text-center mt-4">
    <img src="https://img2.pic.in.th/pic/af17ea5feab02084a5a9861e30005ec6.png" width="416" />
  </div>

  <div class="container mt-4">
    <form id="myForm" class="needs-validation" novalidate>
      <div class="text-center mb-3">
        <h3 class="text-light">IT Helpdesk Specialists</h3>
      </div>
      <div class="mb-3">
        <label for="name">ชื่อ (ผู้ติดต่อ)</label>
        <input type="text" id="name" class="form-control" required />
        <div class="invalid-feedback"> กรุณากรอกชื่อ-สกุล</div>
      </div>
      <div class="mb-3">
        <label for="phone">เบอร์ติดต่อ (ที่สามารถติดต่อได้)</label>
        <input type="text" id="phone" class="form-control" required />
        <div class="invalid-feedback">กรุณากรอกเบอร์</div>
      </div>
      <div class="mb-3">
        <label for="device">*อุปกรณ์ที่มีปัญหา*</label>
        <select id="device" class="form-select" required>
          <option value="">-- กรุณาเลือก --</option>
          <option>Computer PC</option>
          <option>Notebook</option>
          <option>MacBook</option>
          <option>Macintosh</option>
        </select>
        <div class="invalid-feedback">กรุณาเลือกอุปกรณ์</div>
      </div>
      <div class="mb-3">
        <label for="problem">*แจ้งปัญหาการใช้งาน*</label>
        <select id="problem" class="form-select" required>
          <option value="">-- เลือกหัวข้อที่คุณต้องการ --</option>
          <option>VPN ใช้งานไม่ได้</option>
          <option>WiFi ไม่เสถียร</option>
          <option>โปรแกรม Error</option>
          <option>VPN ใช้งานไม่ได้</option>
          <option>WiFi ไม่เสถียร</option>
          <option>โปรแกรม Error</option>
          <option>VPN ใช้งานไม่ได้</option>
          <option>WiFi ไม่เสถียร</option>
          <option>โปรแกรม Error</option>
          <option>VPN ใช้งานไม่ได้</option>
          <option>WiFi ไม่เสถียร</option>
          <option>โปรแกรม Error</option>
        </select>
        <div class="invalid-feedback">กรุณาเลือกหัวข้อที่คุณต้องการ</div>
      </div>
      <div class="mb-3">
        <label for="place">*แผนก*🔎</label>
        <select id="place" class="form-select" required>
          <option value="">-- กรุณาเลือก --</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
          <option>Marketing</option>
        </select>
        <div class="invalid-feedback">กรุณาเลือกแผนก</div>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-warning w-100">
          <i class="bi bi-send-fill"></i> แจ้งซ่อม
        </button>
      </div>
    </form>
  </div>

  <!-- JS Libraries -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/gasparesganga-jquery-loading-overlay@2.1.7/dist/loadingoverlay.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbzkrK9KYlubWWEE_Xu2pxVOQVOK11B9AKDmY8D8oc9ftzko1On7LaIZ89fvgS2ECgAX/exec';

    $(document).ready(() => {
      liff.init({ liffId: '1657934014-yMv0gDop', withLoginOnExternalBrowser: true })
        .then(() => console.log('LIFF Initialized'))
        .catch(err => Swal.fire({ icon: 'error', title: 'LIFF error', text: err.message }));
    });

    function submitForm() {
      $.LoadingOverlay('show');

      const uid = liff.getDecodedIDToken()?.sub || '';
      if (!uid) {
        $.LoadingOverlay('hide');
        Swal.fire({ icon: 'error', title: 'ไม่พบ LINE User ID' });
        return;
      }

      const data = {
        opt: 'savedata',
        uid: uid,
        name: $('#name').val(),
        phone: $('#phone').val(),
        device: $('#device').val(),
        problem: $('#problem').val(),
        place: $('#place').val()
      };

      $.ajax({
        method: 'POST',
        url: scriptUrl,
        data: data,
        dataType: 'json',
        success: function (res) {
          $.LoadingOverlay('hide');
          if (res.status === 'success') {
            Swal.fire({ icon: 'success', title: 'แจ้งซ่อมเรียบร้อย' }).then(() => {
              const flex = {
                type: 'flex',
                altText: 'แจ้งซ่อมเรียบร้อย',
                contents: {
                  type: 'bubble',
                  body: {
                    type: 'box',
                    layout: 'vertical',
                    spacing: 'md',
                    contents: [
                      {
                        type: 'text',
                        text: '✅✅แจ้งซ่อมเรียบร้อย✅✅',
                        weight: 'bold',
                        size: 'lg',
                        align: 'center'
                      },
                      { type: 'separator', margin: 'md' },
                      {
                        type: 'text',
                        text: '🚨รหัสงานซ่อม🚨: ' + res.id,
                        size: 'xl',
                        "align": "center"
                      },
                      {
                        type: 'text',
                        text: 'อุปกรณ์ที่มีปัญหา: ' + data.device,
                        size: 'sm',
                        wrap: true
                      },
                      {
                        type: 'text',
                        text: 'ปัญหาที่แจ้ง: ' + data.problem,
                        size: 'sm',
                        wrap: true
                      }
                    ]
                  }
                }
              };
              liff.sendMessages([
                {
                  type: 'text',
                  text: `\nรหัสงาน: ${res.id}`
                },
                flex
              ]).then(() => liff.closeWindow());
            });
          } else {
            Swal.fire({ icon: 'error', title: 'บันทึกข้อมูลล้มเหลว' });
          }
        },
        error: function (err) {
          console.error(err);
          $.LoadingOverlay('hide');
          Swal.fire({ icon: 'error', title: 'บันทึกข้อมูลไม่สำเร็จ' });
        }
      });
    }

    (() => {
      const form = document.querySelector('#myForm');
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
        } else {
          submitForm();
        }
      }, false);
    })();
  </script>
</body>
</html>
