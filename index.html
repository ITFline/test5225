<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แจ้งปัญหา IT Helpdesk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #000033;
      font-family: 'Kanit', sans-serif;
    }

    label {
      color: white;
    }

    .container {
      max-width: 600px;
    }
  </style>
</head>

<body>
  <div align="center" class="mt-3">
    <img src="https://img2.pic.in.th/pic/af17ea5feab02084a5a9861e30005ec6.png" width="416">
  </div>

  <div class="container mt-4">
    <form id="myForm" class="needs-validation" novalidate>
      <div class="text-center mb-3">
        <h3 class="text-light">แจ้งปัญหา IT Helpdesk</h3>
      </div>
      <div class="mb-3">
        <label for="name">ชื่อ (ผู้ติดต่อ)</label>
        <input type="text" id="name" class="form-control" required>
        <div class="invalid-feedback">กรุณากรอกชื่อ</div>
      </div>
      <div class="mb-3">
        <label for="phone">เบอร์ติดต่อ</label>
        <input type="text" id="phone" class="form-control" required>
        <div class="invalid-feedback">กรุณากรอกเบอร์</div>
      </div>
      <div class="mb-3">
        <label for="device">อุปกรณ์ที่มีปัญหา</label>
        <select id="device" class="form-select" required>
          <option value="">-- กรุณาเลือก --</option>
          <option>Computer PC</option>
          <option>Notebook</option>
          <option>MacBook</option>
          <option>อื่นๆ</option>
        </select>
        <div class="invalid-feedback">กรุณาเลือกอุปกรณ์</div>
      </div>
      <div class="mb-3">
        <label for="problem">ปัญหาที่พบ</label>
        <select id="problem" class="form-select" required>
          <option value="">-- กรุณาเลือก --</option>
          <option>WiFi ไม่สามารถใช้งานได้</option>
          <option>VPN ใช้งานไม่ได้</option>
          <option>โปรแกรม Error</option>
        </select>
        <div class="invalid-feedback">กรุณาเลือกปัญหา</div>
      </div>
      <div class="mb-4">
        <label for="place">แผนก</label>
        <select id="place" class="form-select" required>
          <option value="">-- กรุณาเลือก --</option>
          <option>IT Facilities</option>
          <option>Call Center</option>
          <option>Marketing</option>
        </select>
        <div class="invalid-feedback">กรุณาเลือกแผนก</div>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-warning w-100">
          <i class="bi bi-send-fill"></i> ส่งแจ้งซ่อม
        </button>
      </div>
    </form>
  </div>

  <!-- JS Libraries -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/gasparesganga-jquery-loading-overlay@2.1.7/dist/loadingoverlay.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const scriptUrl = 'YOUR_SCRIPT_URL';

    $(document).ready(() => {
      liff.init({ liffId: 'YOUR_LIFF_ID', withLoginOnExternalBrowser: true })
        .then(() => console.log('LIFF initialized'))
        .catch(err => {
          Swal.fire({ icon: 'error', title: 'LIFF error', text: err.message });
        });
    });

    function submitForm() {
      $.LoadingOverlay('show');

      const uid = liff.getDecodedIDToken()?.sub || '';
      if (!uid) {
        $.LoadingOverlay('hide');
        Swal.fire({ icon: 'error', title: 'ไม่พบ LINE User ID', text: 'กรุณาเข้าสู่ระบบใหม่' });
        return;
      }

      const data = {
        opt: 'savedata',
        uid,
        name: $('#name').val(),
        phone: $('#phone').val(),
        device: $('#device').val(),
        problem: $('#problem').val(),
        place: $('#place').val()
      };

      $.ajax({
        method: 'POST',
        url: scriptUrl,
        data,
        dataType: 'json',
        success: function (res) {
          $.LoadingOverlay('hide');
          if (res.status === 'success') {
            Swal.fire({ icon: 'success', title: 'แจ้งซ่อมเรียบร้อย' }).then(() => {
              liff.sendMessages([{
                type: 'text',
                text: `✅ แจ้งซ่อมเรียบร้อย\\nรหัสงาน: ${res.id}\\nอุปกรณ์: ${data.device}\\nปัญหา: ${data.problem}`
              }]).then(() => liff.closeWindow());
            });
          } else {
            Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาดขณะบันทึก' });
          }
        },
        error: function () {
          $.LoadingOverlay('hide');
          Swal.fire({ icon: 'error', title: 'ไม่สามารถเชื่อมต่อได้' });
        }
      });
    }

    (() => {
      const form = document.querySelector('#myForm');
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
        } else {
          submitForm();
        }
      }, false);
    })();
  </script>
</body>

</html>
